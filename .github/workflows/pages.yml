name: Publicar Orthomax

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de Gimo
        run: npm ci --prefix apps/gina
      - name: Verificar cálculos y conservación de datos de Gimo
        run: npm test --prefix apps/gina
      - run: npm test
      - run: npm run check
      - run: npm run build -- --pages
      - run: node tools/check.mjs --dist
      - name: Preparar navegador para las pruebas de Gimo
        working-directory: apps/gina
        run: npx playwright install --with-deps chromium webkit
      - name: Verificar movimientos, respaldo y actualización de Gimo
        working-directory: apps/gina
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
